spring:
  application:
    name: WebBoardCopilot

  datasource:
    url: jdbc:mariadb://localhost:3306/board_app
    username: test
    password: '!@test1234'
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
        format_sql: true

  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML

mybatis:
  mapper-locations: classpath:/mapper/**/*.xml
  type-aliases-package: com.example.webboard.domain
  configuration:
    map-underscore-to-camel-case: true
    jdbc-type-for-null: NULL

server:
  port: 8080
  servlet:
    context-path: /

logging:
  level:
    root: INFO
    com.example.webboard: DEBUG
    org.springframework.security: DEBUG
