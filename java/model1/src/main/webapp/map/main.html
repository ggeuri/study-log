<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<style>
    /* 전체 레이아웃 박스 */
    .container{
        width: 1100px;
        height: 500px;
        background-color: antiquewhite;
        margin: auto;
        display: flex;
        border: solid 1px black;
    }

    /* 왼쪽 버튼 영역 */
    .aside{
        width: 100px;
        height: 100%;
    }

    .aside button{
        width: 90%;
        height: 20px;
    }

    /* 오른쪽 지도 영역 */
    .content{
        width: 1000px;
        height: 100%;
        background-color: white;
    }
</style>

<!-- jQuery 로드 -->
<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>

<script>
    // 전역 변수로 구글맵 객체를 보관
    let map;
    
    // 1) Google Maps 초기화 (API 스크립트의 callback=init 에 의해 호출)
    function init(){
        // 지도 기본 옵션: 초기 중심 좌표 + 줌 레벨
        let mapProp = {
            center: new google.maps.LatLng(37.5040743, 127.0292871),
            zoom: 18,
        };

        // .content 영역을 지도 캔버스로 사용
        map = new google.maps.Map(document.querySelector(".content"), mapProp);
    }
    
    // 2) 서버에서 받은 데이터로 지도에 마커/말풍선 렌더링
    function render(data){
        console.log("렌더링 전 넘겨받은 객체", data);
        
        // 구글맵에 마커 표시하기(API) 참고:
        // https://www.w3schools.com/graphics/google_maps_overlays.asp

        // 서버 응답 객체에서 위도(lat) / 경도(lot) 추출
        let lati = data.response.body.items.item[0].lat; // 위도 
        let lng  = data.response.body.items.item[0].lot; // 경도 
        
        // 먼저 카메라(지도 중심) 위치를 해당 좌표로 이동
        let pos = new google.maps.LatLng(lati, lng);  // 예: 가지산 위치 
        map.setCenter(pos);

        // 지도 위에 표시할 마커 생성
        // animation 옵션으로 BOUNCE 효과 추가
        let marker = new google.maps.Marker({
            position: pos,
            animation: google.maps.Animation.BOUNCE
        });
        
        // 산 이름 (말풍선에 표시할 내용)
        let info = data.response.body.items.item[0].frtrlNm; // 산 이름 
        
        // 마커를 실제 지도에 올리기
        marker.setMap(map);

        // 팝업 윈도우(InfoWindow) 생성
        let infowindow = new google.maps.InfoWindow({
            content: info
        });

        // 어떤 지도(map)의 어떤 마커(marker) 위에 말풍선을 띄울지 지정
        infowindow.open(map, marker); 
    }
 
    // 3) AJAX로 /map/list.jsp에서 JSON 데이터 가져오기
    function getList(){
        let xhttp = new XMLHttpRequest();
        
        // 서버에서 응답이 도착하면 onload가 자동 호출됨
        xhttp.onload = function(){
            console.log("서버로부터 받은 문자열은 ", this.responseText);

            // 서버에서 받은 문자열(JSON)을 JS 객체로 변환
            let obj = JSON.parse(this.responseText); 
            console.log("파싱결과는 ", obj);
            
            // 파싱된 객체를 지도 렌더링 함수에 전달
            render(obj);
        }
        
        // GET 방식으로 /map/list.jsp 호출
        // (servlet, jsp 둘 다 가능하지만, 로직/데이터 제공은 원칙상 서블릿이 더 적절)
        xhttp.open("GET", "/map/list.jsp");

        // 실제 요청 전송 (요청 발생)
        xhttp.send();
    }
    
    // 4) jQuery로 버튼 클릭 이벤트 연결
    $(()=>{
        // 버튼 클릭 시 서버에서 데이터 가져와 지도 갱신
        $("button").click(()=>{
            getList();
        });
    });
</script>
</head>
<body>
<div class="container">
    <div class="aside">
        <button type="button">Load</button>
    </div>
    <div class="content"></div>
</div>

<!-- Google Maps API 로드: 완료되면 init() 호출 -->
<script src="https://maps.googleapis.com/maps/api/js?key=key8&callback=init"></script>
</body>
</html>
