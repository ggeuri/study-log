# application.properties
# - Spring Boot 설정 파일: "키=값" 형태로 서버/로그/DB/MyBatis를 설정한다.
# - Boot는 (server.xml, web.xml, context.xml 같은) 번거로운 설정을 대부분 자동으로 처리한다.
# - 그래도 Boot의 기반은 Spring MVC이므로 MVC 개념은 알아두는 게 좋다.

# 1) 애플리케이션 이름(로그/Actuator 등에 표시)
spring.application.name=noticeapp

# 2) 서버 포트(내장 Tomcat 포트 변경)
server.port=9999

# 3) 로그 레벨(패키지별 디버깅 범위 조절)
logging.level.root=info
logging.level.com.ch.noticeapp=debug

# 4) DB 접속 정보 (MySQL)
# - url/username/password가 맞아야 DataSource가 생성되고 서버가 정상 부팅된다.
spring.datasource.url=jdbc:mysql://localhost:3306/kiosk
spring.datasource.username=boot
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 5) MyBatis 설정/매퍼 파일 위치
# - config-location: mybatis-config.xml 위치
# - mapper-locations: SQL 매퍼(xml)들 위치 (패턴 사용 가능)
# ⚠️ '=' 뒤에 공백 넣지 말 것 (classpath 값이 정확히 인식되어야 함)
#mybatis.config-location=classpath:/mybatis/mybatis-config.xml
mybatis.mapper-locations=classpath:/mybatis/*Mapper.xml
mybatis.type-aliases-package=com.ch.noticeapp.notice.dto.mybatis
mybatis.configuration.map-underscore-to-camel-case=true


# ✅ 추가로 꼭 알아둘 것(중요)
# - 위 설정은 "xml 위치"만 알려준다.
# - Mapper 인터페이스(예: NoticeMapper)는 @Mapper 또는 @MapperScan으로 빈 등록이 되어야
#   "No qualifying bean of type NoticeMapper" 에러가 안 난다.