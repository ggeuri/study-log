<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
#stage{
    width: 1000px;
    height: 700px;
    background-color: rgb(255, 255, 205);
    margin: auto;
    position: relative; 
    /* 자식에 포지션 명시되었기때문에 부모인 스테이지에도 명시해야함 
    static+letf,top 적용되는 상태, 다른태그에 의해 위치결정
    realative라 한다. 즉 다른 태그에 의해 밀려난 바로 그자리, 자기자신의 본연의 위치  */
}
</style>
<script>
    // 현실의 총알을 정의한다. (즉 클래스를 정의한다.)
    // java, C#에서는 개발자가 클래스를 정의하면 새로운 자료형을 정의하는 것으로 인정해줌
    // 따라서 문법 형식은 아래와 같다 
    // int x = 5;   
    // Dog d = new Dog();
    // body 즉 문서에 이벤트 연결할때는 window객체
    class Bullet{
        constructor(){ //constructor()는 생성자 메서드, new로 객체 생성될 때 자동 실행
            this.x = 0 ; // x라는 인스턴스 변수 선언. java에서는 전역변수가 필요없는 이유 
            // 일반적인 의미의 전역변수란 프로그램이 끝날때까지 그 생명력이 유지되는 변수를 의미 
            // 객체지향 언어에서는 class의 영역 바깥쪽에 코드를 작성할 수 없기 때문에 전역변수를 지원하지 않음
            // 그럼 누적은 어떻게 처리하나? OOP언어에서는 개발자가 new에 의해 생성한 인스턴스를 죽이는 방법이 없기 떄문에 
            // 인스턴스변수로 선언하면 그 객체가 죽을때까지 그 값이 같이 유지되므로, 전역변수를 사용할 일 없음


            // 아래의 코드에 의해 div DOM객체가 생성됨 (문서내의 모든 태그와 1:1 대응되는 요소. 즉 태그를 모방한 객체 체계)
            // Document Object Model() 문서 내 모든 태그 모방하여 객체화시켜 모델링
            this.div = document.createElement("div"); //총알 시각화시킬 div태그,<div></div>동일

            this.div.style.width = 30+"px"; // block태그니 너비 높이 적용가능 
            this.div.style.height = 30+"px";
            this.div.style.backgroundColor="red";
            this.div.style.borderRadius=50+"%";
            this.div.style.position="absolute";
            this.div.style.left = 0 + "px";
            this.div.style.top = 300 + "px";

            
            // 스테이지 부착
            this.stage = document.getElementById("stage");
            

            // stage에 자식요소로 div를 부탁하기 
            this.stage.appendChild(this.div);

            this.move();
            // 일정시간간격으로 this.move()를 호출하도록 부탁
            // 아래 보이는 함수정의는 화살표함수를 말하며 java언어에서의 lambda와 흡사
            // java에서 람다는 함수형 인터페이스 의미  
            setInterval(()=>{
                // 화살표함수내에서의 this는 자기자신의 바로 바깥쪽 Context를 의미하므로, 이 총알 객체의 인스턴스를 의미
                this.move();
            },10);


        }

        move(){
            this.x+=10;


            // 총알은 x축방향으로 점점 값이 커지면 되기 때문에 left값만 조정 
            this.div.style.left=this.x+"px";

        }

    }

    window.addEventListener("keydown", function(e){ //event객체를 매개변수로 사용하는 법 
        // alert('누름?');
        // 키보드 중 space바의 아스키를 조건으로 부여하여 new를 시도하자 
        if(e.keyCode==32){
            new Bullet();
        };

    });
</script>
<body>
    <div id = "stage">

    </div>
</body>
</html>
