<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>STOMP Room Chat - UI Only</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f6f7fb;
            margin: 0;
        }

        .wrap {
            max-width: 980px;
            margin: 0 auto;
            padding: 18px;
        }

        .card {
            background: white;
            border-radius: 14px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.07);
            padding: 16px;
        }

        .row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        .row>* {
            margin: 4px 0;
        }

        input,
        select {
            padding: 10px;
            border-radius: 10px;
            border: 1px solid #d9dbe3;
            outline: none;
        }

        button {
            padding: 10px 14px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }

        button.primary {
            background: #2e6cff;
            color: white;
        }

        button.ghost {
            background: #eef1ff;
        }

        .status {
            font-size: 13px;
            color: #555;
        }

        .chatBox {
            height: 420px;
            overflow: auto;
            background: #0b1020;
            color: #e9ecff;
            border-radius: 14px;
            padding: 12px;
        }

        .msg {
            padding: 10px;
            border-radius: 12px;
            margin: 8px 0;
            background: rgba(255, 255, 255, 0.06);
        }

        .meta {
            font-size: 12px;
            opacity: 0.85;
            margin-bottom: 4px;
        }

        .text {
            font-size: 14px;
            white-space: pre-wrap;
        }

        .pill {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.14);
            margin-left: 6px;
            font-size: 12px;
        }

        hr {
            border: 0;
            border-top: 1px solid #eee;
            margin: 14px 0;
        }

        code {
            background: #f1f3f8;
            padding: 2px 6px;
            border-radius: 6px;
        }
    </style>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
</head>

<body>
    <div id="app"></div>

</body>
<script type="text/babel">
    function App() {
        //바인드 변수(컴포넌트와 함께 살아가면서, 특히 UI와 후킹되어있는 상태 변수)
        const [name, setName] = React.useState("");
        const [roomId, setRoomId] = React.useState("");


        //UI와 상관없이 생명주기때문에 쓰는 Ref 변수 
        const stompRef = React.useRef(null);


        // 컴포넌트 랜더링 직후에 사용자 정보 가져오기 
        React.useEffect(() => {
            fetch("http://localhost:9992/api/auth/me", {
                method: "GET",
                credentials: "include" //세션과 쿠키구현시 필요. 이 옵션이 있어야 브라우저가 쿠키를 서버에 전송 
            })
                .then(res => res.json())
                .then(data => {
                    //우측 상단 영역에 채팅 진행할 사람 이름 자동 출력 
                    setName(data.name);

                })
                .catch(err => console.log("조회 실패"));

        }, []);

        //채팅서버 접속 
        const connect = () => {
            //웹소캣이 표준이나 환경따라 동작안할수도있어서 SockJS사용. 효과 동일 
            const sock = new SockJS("http://localhost:9992/ws/stomp");

            const stomp = Stomp.over(sock); //스톰프는 멀티캐스팅 채팅을 구독개념으로 단순화시켜서 보다 쉽게 메시지통신구현할수있음. 웹소켓이나 Sock.js기반 위에서 실행됨. 
            stomp.connect({}, () => {
                console.log("접속 성공");
                stompRef.current = stomp; //Ref객체에 무언가 담을때는 객체 자체에 담는게 아니라 current 속성에 담는것 
            }, (err) => {
                console.log("STOMP connect error", err);
            });

        }

        //방 입장
        const joinRoom = () => {
            if(!stompRef.current || !stompRef.current.connected){
                alert("먼저 접속해주세요");
                return ; 
            }

            const rid = roomId.trim(); 
            if(!rid){
                alert("룸 번호를 입력하세요");
                return;
            }

            //이전 구독 있으면 구독해제 

            //채팅메시지 초기화 

            //룸 참여의 의미는 스톰프 채팅서버에게 이 방을 구독하겠다는 의미 
            stompRef.current.subscribe(`/topic/room/${rid}`,(frame)=>{
                //데이터 전송을 위해 JSON 문자열로 변환 
                const body = JSON.parse(frame.body);
            });
        }

        //핵심메서드다
        const send = () => {
            stompRef.current.send("/app/room/"+roomId+"/send",{},"aaaaaa");
        }

        //접속 해제 
        const disconnect = () => {
            //접속해제 하게 되면, 구독 취소 

            if(stompRef.current){
                stompRef.current.disconnect(()=>{}); 
                stompRef.current = null; //초기화 
            }
        }

        return (
            <div className="wrap">
                <div className="card">
                    <h2 style={{ margin: "0 0 10px 0" }}>Step2+3 - STOMP 채팅방(Room) (UI Only)</h2>

                    <div className="row">
                        <div className="status">
                            <b>Status:</b> <span id="statusText">DISCONNECTED</span>
                            <span className="pill" id="roomPill" style={{ display: "none" }}>Room 1</span>
                        </div>

                        <div style={{ flex: 1 }}></div>

                        <button className="ghost" type="button" onClick={connect}>Connect</button>
                        <button className="ghost" type="button" onClick={disconnect}>Disconnect</button>
                    </div>

                    <hr />

                    <div className="row">
                        <input id="roomId" placeholder="roomId (예: 1,2,study)" value ={roomId} onChange = {e => setRoomId(e.target.value)} />
                        <button className="primary" type="button" onClick={joinRoom}>Join Room</button>

                        <div style={{ flex: 1 }}></div>

                        <input id="nickname" placeholder="닉네임" value={name} />

                        <select id="emoji" defaultValue="🙂">
                            <option value="🙂">🙂</option>
                            <option value="😄">😄</option>
                            <option value="😎">😎</option>
                            <option value="🔥">🔥</option>
                            <option value="🎉">🎉</option>
                            <option value="✅">✅</option>
                            <option value="⚠️">⚠️</option>
                            <option value="❤️">❤️</option>
                        </select>
                    </div>

                    <div style={{ marginTop: 14 }} className="chatBox" id="chatBox">
                        <div style={{ opacity: 0.75 }}>
                            메시지가 없습니다. Join Room 후 메시지를 보내보세요.
                        </div>

                        <div className="msg">
                            <div className="meta">
                                <b>🙂 데브런</b>
                                <span style={{ marginLeft: 8 }}>2026-01-23 09:10:11</span>
                            </div>
                            <div className="text">안녕하세요! 디자인만 남긴 UI입니다.</div>
                        </div>
                    </div>

                    <div className="row" style={{ marginTop: 12 }}>
                        <input id="message" style={{ flex: 1, minWidth: 260 }} defaultValue="" placeholder="메시지 입력" />
                        <button className="primary" type="button" onClick={send}>Send</button>
                    </div>

                    <div style={{ marginTop: 10, fontSize: 12, color: "#666" }}>
                        WS 접속: <code id="wsUrl">http://{"{host}"}:9992/ws-stomp</code>
                        {" "} / 구독: <code>/topic/room/{"{roomId}"}</code>
                        {" "} / 전송: <code>/app/room/{"{roomId}"}/send</code>
                    </div>
                </div>
            </div>
        );
    }

    const root = ReactDOM.createRoot(document.getElementById("app"));
    root.render(<App />);
</script>


</html>
