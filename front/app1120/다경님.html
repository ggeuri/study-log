<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0
        }

        .container {
            max-width: fit-content;
            height: 650px;
            display: flex;
            margin: 0 auto;
        }

        .container .aside_regist,
        .container .aside_detail {
            width: 150px;
            padding: 30px 5px;
            box-sizing: border-box;
        }
        .container input{max-width:100%;box-sizing: border-box;}
        .container div[class ^= aside] input{margin-bottom:5px}
        .container div[class ^= aside] .btnwr{display:flex;gap:4px}
        .container div[class ^= aside] .btnwr button{flex-grow: 1;}

        .container .content {
            width: 500px;
            background: #F5F5F5;
        }

        .container .content .header {
            background: #eee;
            padding: 5px;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
            gap: 5px
        }
    </style>

    <script>
        function join(){
            let joinForm = document.getElementById('join');
            let id = joinForm.id.value;
            let pwd = joinForm.pwd.value;
            let name = joinForm.name.value;
        }
        
        
        
        
        
        function init(){
            join();
        }
        window.addEventListener("load",function(){
            init();
        });
    </script>
</head>

<body>
    <div class="container">
        <div class="aside_regist">
            <form id="join">
                <input type="text" name="id" placeholder="아이디">
                <input type="password" name="pwd" placeholder="비밀번호">
                <input type="text" name="name" placeholder="이름">
                <div class="btnwr">
                    <button id="join_btn">가입!</button>
                </div>
            </form>
        </div>
        <div class="content">
            <div class="header">
                <input type="text" name="search" id="search" placeholder="검색어 입력">
                <button id="sc_btn">검색</button>
            </div>
            <div class="list">
                <ul></ul>
            </div>
        </div>
        <div class="aside_detail">
            <form id="detail">
                <input type="text" name="id" placeholder="아이디">
                <input type="password" name="pwd" placeholder="비밀번호">
                <input type="text" name="name" placeholder="이름">
                <div class="btnwr">
                    <button id="ed_btn">수정</button>
                    <button id="del_btn">삭제</button>
                </div>
            </form>
        </div>
    </div>
</body>

</html>
