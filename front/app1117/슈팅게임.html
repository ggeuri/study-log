<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body{margin: 0px;}
    .container{
        /* 컨테이너에 이미지를 배경으로 넣어보기. 배경은 백그라운드로 깔리기때문에 이미지간 충돌을 일으키지않는다.
        디폴트가 패턴반복(마치 벽지처럼..)*/
        background-image: url(images/shoting/bg.jpg);
        width: 100%;
        height: 576px; /*패턴반복 피하기위해 이미지정보 먼저가져옴 1920 × 576*/
    }
    #pic{
        width: 70px;
        height: 55px;
        position: absolute; /*부모를 기준으로 포지션설정*/ 
        left: 100px; /*오른쪽으로 갈수록 x 증가*/
        top: 200px; /*아래로갈수록 y 증가 */
     
    }

</style>
<body onKeyDown="control()" onload="setInterval('bgEffect()',10)">
     <div class = "container">
        <img src="images/shoting/plane.png" alt="" id="pic">

     </div>

    
</body>
<script>
    // 우측이동
    let move = 100; 
    let moveop = 200;
    let bgX = 0; 
    
    function control(){
        // 상하좌우 방향키에만 반응을 보여야 함 
        // js에 이미 내장된 객체 중 event라는 객체는 브라우저 사용자가 한 행위에 대한 모든 정보를 포함하고 있음 
        // 컴퓨터는 1,0만을 이해하므로, 사용자가 키보드에서 문자를 입력하면 직접적으로 이해 못함. => 중간단계 십진수 표 체계 마련. 
        // a 입력하면 65, b = 66로 십진수가 입력되고 이 십진수가 이진수로 변환되어 사용됨. 
        // 십진수 체계는 미국표준협회에서 정해놓은 규칙이며 오늘날 영문자보다 더 넓은 범위의 문자를 지원하는 유니코드까지 확장
        console.log("사용자가 누른 키에 대한 아스키값은",event.keyCode);
        // 상하좌우 38,40,37,39

        // if(event.keyCode == '38'){
        //     moveTop();
        // } else if(event.keyCode == '40'){
        //     moveDown();
        // } else if(event.keyCode == '37'){
        //     moveLeft();
        // } else if(event.keyCode == '39'){
        //     moveRight();
        // };
        
        switch (event.keyCode) {
            case 38 : moveTop(); break;
            case 40 : moveDown(); break;
            case 37 : moveLeft(); break;
            case 39 : moveRight(); break;
        };
    }

    function bgEffect(){
        bgX-=4;
        document.querySelector(".container").style.backgroundPosition= `${bgX}px 0px`;
    }

    function moveRight(){
        let pic = document.getElementById("pic");
        move += 10;
        pic.style.left = move+"px";
        // position의 left: 100px; 얘가 증가하면됨
    }
    //좌측이동
    function moveLeft(){
        let pic = document.getElementById("pic");
        move -= 10;
        pic.style.left = move+"px";
        // position의 left: 100px; 얘가 증가하면됨
    }
    // 위로이동
    function moveTop(){
        let pic = document.getElementById("pic");
        moveop -= 10;
        pic.style.top = moveop+"px";
        // position의 left: 100px; 얘가 증가하면됨
    }
    // 아래이동
    function moveDown(){
        let pic = document.getElementById("pic");
        moveop += 10;
        pic.style.top = moveop+"px";
        // position의 left: 100px; 얘가 증가하면됨
    }
    // 왼쪽으로 움직여야하니까 x를 감소시켜야한다 
    

    document.querySelector(".container").style.backgroundPosition="-200px 0px";

</script>
</html>
