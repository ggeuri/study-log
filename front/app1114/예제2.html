<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            position: relative;
            height: 450px;
            width: 1000px;
            margin: auto;
            /* background-color: aqua; */
            
        }
        .box1{
            background-color: rgb(255, 0, 0);
            /* display: inline-block; */
            height: 50px;
            width: 100%;

        }
        .box2{
            background-color: rgba(255, 59, 59, 0.968);
            height: 50px;
            /* display: inline-block; */
            width: 100%; /*컨테이너따라감 그리고 어차피 기본이 100%라 없어도 똑같음*/

        }
        .box3{
            background-color: rgb(255, 123, 123);
            float: left; 
            /* aside1이 float된 후 그 뒤에 오는 요소인 aside2는 block이라 float된 요소를 몰라서 붙음 aside2도 띄움 */
            width: 500px;
            height: 300px;
            
        }
        .box4{
            background-color: rgb(255, 158, 158);
            float: right;
            /* 현재로서는 양쪽 모두 500px라 left,right 무관. 어차피 밀려서 오른쪽에 붙음. 정확한건 right */
            width: 500px;
            height: 300px;

        }
        .box5{
            background-color: rgb(255, 201, 201);
            height: 50px;
            clear: both; 
            /* left나 right로 float된 요소들의 다음 줄로 위치. 따라서 clear쓰면 굳이 같이 띄울필요없음 */
            /* position: absolute; */
        }
        .img{
            position: absolute;
            left : 0;
            

        }



    </style>
</head>
<body>
    <div class = "container">
        <img class = "img" src="images/meta.webp">
        <div class = "box1"></div> <!--header-->
        <div class = "box2"></div> <!--nav-->
        <div class = "box3"></div> <!--aside1이 float된 후 그 뒤에 오는 요소인 aside2는 block이라 float된 요소를 몰라서 붙음 aside2도 띄움-->
        <div class = "box4"></div> <!--aside2-->
        <div class = "box5"></div> <!--footer-->
    </div>
</body>
</html>
