<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<style>
    .container {
        display: flex;
        width: 1500px;
        height: 700px;
        background-color: aquamarine;

    }

    .aside{
        width: 200px;
        height: 100%;
        background-color: rgb(67, 24, 65);
        display: flex;
        flex-direction: column;
    }

    .content{
        width: 1300px;
        height: 100%;
        background-color: black;

    }
</style>
<script>
    function init(){
    let mapProp= {
        center:new google.maps.LatLng(위도,경도),
        zoom:18,
        };
    let map = new google.maps.Map(document.getElementById("content"),mapProp);

    //맵에 마커 띄우기 
    let marker = new google.maps.Marker({position: mapProp.center});

    marker.setMap(map);
    }
</script>
</head>

<body>
    <div class = "container">
        <div class = "aside">
            <input type="text">
            <input type="text">
            <input type="text">
        </div>
        <div class = "content" id = "content"></div>

    </div>
    <script src="https://maps.googleapis.com/maps/api/js?key=API키넣는곳&callback=init"></script>
</body>
</html>
